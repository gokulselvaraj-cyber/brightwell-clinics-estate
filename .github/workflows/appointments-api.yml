name: appointments-api
on:
  push:
    branches: [main]
    paths: ["services/appointments-api/**"]
  pull_request:
    paths: ["services/appointments-api/**"]
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/appointments-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest -q
  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ghcr.io/brightwell/appointments-api:${{ github.sha }} services/appointments-api
      - run: docker push ghcr.io/brightwell/appointments-api:${{ github.sha }}
