name: terraform
on:
  pull_request:
    paths: ["infra/terraform/**"]
jobs:
  plan:
    runs-on: ubuntu-24.04
    strategy:
      matrix: {env: [dev, test, prod]}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.9.8"}
      - run: terraform -chdir=infra/terraform/envs/${{ matrix.env }} init -input=false
      - run: terraform -chdir=infra/terraform/envs/${{ matrix.env }} plan -input=false
