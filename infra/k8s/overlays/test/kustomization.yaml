apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bw-test
resources:
  - ../../base
patches:
  - path: appointments-api.yaml
  - path: visit-summary.yaml
  - path: reminder-worker.yaml
  - path: patient-portal.yaml
images:
  - name: ghcr.io/brightwell/appointments-api
    newTag: "rc"
  - name: ghcr.io/brightwell/visit-summary
    newTag: "rc"
  - name: ghcr.io/brightwell/reminder-worker
    newTag: "rc"
  - name: ghcr.io/brightwell/patient-portal
    newTag: "rc"
