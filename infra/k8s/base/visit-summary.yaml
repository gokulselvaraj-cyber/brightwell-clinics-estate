apiVersion: apps/v1
kind: Deployment
metadata:
  name: visit-summary
  labels: {app: visit-summary}
spec:
  replicas: 2
  selector:
    matchLabels: {app: visit-summary}
  template:
    metadata:
      labels: {app: visit-summary}
    spec:
      containers:
        - name: visit-summary
          image: ghcr.io/brightwell/visit-summary:latest
          ports:
            - containerPort: 8070
          envFrom:
            - configMapRef: {name: visit-summary-config}
            - secretRef: {name: visit-summary-secrets, optional: true}
          readinessProbe:
            httpGet: {path: /healthz, port: 8070}
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: visit-summary
spec:
  selector: {app: visit-summary}
  ports:
    - port: 8070
      targetPort: 8070
