# Values for the shared Airflow chart (apache-airflow/airflow 1.15.0), namespace airflow
executor: KubernetesExecutor
defaultAirflowTag: "2.9.3"
dags:
  gitSync:
    enabled: true
    repo: git@git.brightwell.internal:platform/brightwell-clinics-estate.git
    branch: main
    subPath: data-pipeline/dags
env:
  - name: BW_PIPELINE_ENV
    value: prod
  - name: AIRFLOW__CORE__DEFAULT_TIMEZONE
    value: Europe/London
secret:
  - envName: AIRFLOW_CONN_APPOINTMENTSDB_REPLICA
    secretName: airflow-connections
    secretKey: appointmentsdb_replica
